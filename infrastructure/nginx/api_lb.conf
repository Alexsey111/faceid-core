resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

log_format upstream_timing
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    'rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time '
    'ua="$upstream_addr" us="$upstream_status"';

# --- HTTP → HTTPS redirect -------------------------------------------------
# /healthz оставляем на 80 (200) — чтобы healthcheck-пробы LB/оркестратора
# работали без TLS-сертификата; всё остальное уходим в 301 на HTTPS.
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log upstream_timing;
    error_log /var/log/nginx/error.log warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (TLS termination) ----------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/access.log upstream_timing;
    error_log /var/log/nginx/error.log warn;

    # Сертификаты монтируются из тома ./certs/ (см. docker-compose api_lb).
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key  /etc/nginx/ssl/key.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # HSTS (ТЗ 5: передача HTTPS) — форсировать HTTPS на клиентах.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $api_upstream "http://api:8000";

        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # За nginx TLS терминирован → upstream получает корректный proto.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;

        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_buffering off;
    }
}