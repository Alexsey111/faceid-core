#D:\python projects\faceid-core\infrastructure\docker-compose.yml

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: infrastructure/docker/worker.Dockerfile
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "2.0"
  environment:
    - ENV=dev
    - MODELS_DIR=/app/models
    - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - REDIS_HOST=redis
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    - CELERYD_PREFETCH_MULTIPLIER=1
    - WORKER_COUNT=8
    - WORKER_SEMAPHORE=${WORKER_SEMAPHORE:-1}
    - ASYNC_THROUGHPUT_PER_SEC=${ASYNC_THROUGHPUT_PER_SEC:-12}
    - BACKPRESSURE_MAX_QUEUE_DELAY_MS=${BACKPRESSURE_MAX_QUEUE_DELAY_MS:-750}
    - INFLIGHT_LIMIT=${INFLIGHT_LIMIT:-32}
    - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-16}
    - EMBED_BATCH_ENABLED=true
    - EMBED_BATCH_SIZE=2
    - EMBED_BATCH_TIMEOUT_MS=10
    - EMBED_BATCH_MAX_WAIT_GUARD_MS=50
    - LIVENESS_ENABLED=false
    - FAISS_ENABLED=false
    - ONNX_INTRA_OP_THREADS=1
    - ONNX_INTER_OP_THREADS=1
    # ArcFace-энкодер ONNX-провайдер: auto (CUDA→DML→CPU fallback),
    # cuda / directml / cpu / csv-список. GPU-override см. docker-compose.gpu.yml.
    - ONNX_ARCFACE_PROVIDERS=${ONNX_ARCFACE_PROVIDERS:-auto}
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  healthcheck:
    # Celery-worker liveness-прокси: достижимость брокера Redis.
    test:
      [
        "CMD-SHELL",
        "python -c \"import os,redis;redis.from_url(os.environ['REDIS_URL']).ping()\" || exit 1",
      ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  postgres:
    image: ankane/pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faceid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_test:
    image: ankane/pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --bind 0.0.0.0
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # /minio/health/ready — 200 когда сервер готов обслуживать запросы
      # (диск смонтирован, конфиг загружен). live = процесс отвечает.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - ENV=dev
      - APP_ROLE=api
      - MODELS_DIR=/app/models
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERYD_PREFETCH_MULTIPLIER=1
      - WORKER_COUNT=8
      - WORKER_SEMAPHORE=${WORKER_SEMAPHORE:-2}
      - ASYNC_THROUGHPUT_PER_SEC=${ASYNC_THROUGHPUT_PER_SEC:-12}
      - BACKPRESSURE_MAX_QUEUE_DELAY_MS=${BACKPRESSURE_MAX_QUEUE_DELAY_MS:-750}
      - INFLIGHT_LIMIT=${INFLIGHT_LIMIT:-10}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-8}
      - ADMISSION_ACTIVE_SERVICE_SLOTS=${ADMISSION_ACTIVE_SERVICE_SLOTS:-4}
      - EMBED_BATCH_ENABLED=true
      - EMBED_BATCH_SIZE=8
      - EMBED_BATCH_TIMEOUT_MS=10
      - EMBED_BATCH_MAX_WAIT_GUARD_MS=20
      - LIVENESS_ENABLED=false
      - FAISS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
      # ArcFace-энкодер ONNX-провайдер: auto (CUDA→DML→CPU fallback),
      # cuda / directml / cpu / csv-список. GPU-override см. docker-compose.gpu.yml.
      - ONNX_ARCFACE_PROVIDERS=${ONNX_ARCFACE_PROVIDERS:-auto}
      # Diagnostic series: soft gate
      - QUALITY_GATE_MODE=soft
      - QUALITY_MIN_FACE_SIDE=48
      - QUALITY_MIN_BLUR_SCORE=25
      - QUALITY_MIN_CONTRAST=10
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --http httptools --backlog 2048 --forwarded-allow-ips='*' --proxy-headers
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  api_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infrastructure/nginx/api_lb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    healthcheck:
      # /healthz отдаётся nginx напрямую 200 "ok" на :80 (без TLS) —
      # см. infrastructure/nginx/api_lb.conf. busybox wget есть в nginx:alpine.
      # 127.0.0.1 (IPv4) — alpine резолвит localhost в ::1 (IPv6), nginx слушает
      # только IPv4 (listen 80) → на ::1 connection refused.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  fast_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    profiles:
      - disabled
    cpus: "2.0"
    deploy:
      resources:
        limits:
          cpus: "2.0"
    environment:
      - ENV=dev
      - APP_ROLE=fast_worker
      - MODELS_DIR=/app/models
      - WORKER_SEMAPHORE=${WORKER_SEMAPHORE:-1}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERYD_PREFETCH_MULTIPLIER=1
      - WORKER_COUNT=8
      - ASYNC_THROUGHPUT_PER_SEC=${ASYNC_THROUGHPUT_PER_SEC:-12}
      - BACKPRESSURE_MAX_QUEUE_DELAY_MS=${BACKPRESSURE_MAX_QUEUE_DELAY_MS:-750}
      - INFLIGHT_LIMIT=${INFLIGHT_LIMIT:-32}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-16}
      - EMBED_BATCH_ENABLED=true
      - EMBED_BATCH_SIZE=8
      - EMBED_BATCH_TIMEOUT_MS=10
      - EMBED_BATCH_MAX_WAIT_GUARD_MS=20
      - LIVENESS_ENABLED=false
      - FAISS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - USE_FAST_PATH=true
      - FAST_PATH_MAX_CONCURRENCY=4
      - FAST_WORKER_URL=http://fast_worker:8000
      - EMBED_BATCH_ENABLED=false
      - FAST_WORKER_MAX_CONCURRENCY=1
      - LIVENESS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --http httptools --backlog 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    cpus: "2.0"
    # For local benchmark runs, do not rely on deploy.replicas.
    # Scale explicitly with:
    #   docker compose up --scale worker=<N>
    deploy:
      resources:
        limits:
          cpus: "2.0"
    environment:
      - ENV=dev
      - MODELS_DIR=/app/models
      - WORKER_COUNT=8
      - WORKER_SEMAPHORE=${WORKER_SEMAPHORE:-2}
      - WORKER_MAX_ACTIVE_BATCHES=${WORKER_MAX_ACTIVE_BATCHES:-2}
      - ENABLE_WORKER_EXPIRY=${ENABLE_WORKER_EXPIRY:-false}
      - MAX_QUEUE_WAIT_SEC=${MAX_QUEUE_WAIT_SEC:-15}
      - MAX_JOB_AGE_MS=${MAX_JOB_AGE_MS:-0}
      - ASYNC_THROUGHPUT_PER_SEC=${ASYNC_THROUGHPUT_PER_SEC:-12}
      - BACKPRESSURE_MAX_QUEUE_DELAY_MS=${BACKPRESSURE_MAX_QUEUE_DELAY_MS:-750}
      - INFLIGHT_LIMIT=${INFLIGHT_LIMIT:-10}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-8}
      - ADMISSION_ACTIVE_SERVICE_SLOTS=${ADMISSION_ACTIVE_SERVICE_SLOTS:-4}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - LIVENESS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      # ArcFace-энкодер ONNX-провайдер: auto (CUDA→DML→CPU fallback),
      # cuda / directml / cpu / csv-список. GPU-override см. docker-compose.gpu.yml.
      - ONNX_ARCFACE_PROVIDERS=${ONNX_ARCFACE_PROVIDERS:-auto}
      # Diagnostic series: soft gate
      - QUALITY_GATE_MODE=soft
      - QUALITY_MIN_FACE_SIDE=48
      - QUALITY_MIN_BLUR_SCORE=25
      - QUALITY_MIN_CONTRAST=10
      - BATCH_SIZE=${BATCH_SIZE:-2}
      - BATCH_COLLECT_TIMEOUT=${BATCH_COLLECT_TIMEOUT:-0.008}
    command: python -m app.workers.verify_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Worker — очередь (без HTTP). Liveness-прокси: достижимость брокера Redis.
      # Если брокер недоступен, worker не может забрать/завершить задачи —
      # считаем контейнер unhealthy. python+redis есть в worker-образе.
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,redis;redis.from_url(os.environ['REDIS_URL']).ping()\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker_metrics:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles:
      - disabled
    cpus: "2.0"
    deploy:
      resources:
        limits:
          cpus: "2.0"
    environment:
      - ENV=dev
      - MODELS_DIR=/app/models
      - ENABLE_WORKER_EXPIRY=${ENABLE_WORKER_EXPIRY:-false}
      - ASYNC_THROUGHPUT_PER_SEC=${ASYNC_THROUGHPUT_PER_SEC:-12}
      - BACKPRESSURE_MAX_QUEUE_DELAY_MS=${BACKPRESSURE_MAX_QUEUE_DELAY_MS:-750}
      - INFLIGHT_LIMIT=${INFLIGHT_LIMIT:-10}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-8}
      - ADMISSION_ACTIVE_SERVICE_SLOTS=${ADMISSION_ACTIVE_SERVICE_SLOTS:-4}
      - MAX_QUEUE_WAIT_SEC=${MAX_QUEUE_WAIT_SEC:-15}
      - MAX_JOB_AGE_MS=${MAX_JOB_AGE_MS:-0}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - LIVENESS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    command: python -m app.workers.verify_worker
    restart: unless-stopped
    ports:
      - "9103:9101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,redis;redis.from_url(os.environ['REDIS_URL']).ping()\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker_fast:
    <<: *worker-base
    profiles:
      - disabled
    cpus: "2.0"
    ports:
      - "9101:9100"
    command: celery -A app.workers.celery_app worker -Q verify_fast --loglevel=info --concurrency=2 --pool=prefork

  worker_heavy:
    <<: *worker-base
    profiles:
      - disabled
    cpus: "2.0"
    ports:
      - "9102:9100"
    command: celery -A app.workers.celery_app worker -Q verify_heavy --loglevel=info --concurrency=4 --pool=prefork

  prometheus:
    image: prom/prometheus
    ports:
      - "9190:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  autoscaler:
    build:
      context: .
      dockerfile: infrastructure/docker/autoscaler.Dockerfile
    profiles:
      - disabled
    command: python autoscaler/autoscaler.py
    network_mode: "host"
    depends_on:
      - prometheus
    environment:
      - PROMETHEUS_URL=http://localhost:9190
      - DOCKER_HOST=unix:///var/run/docker.sock
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  minio_data:
  postgres_test_data:
