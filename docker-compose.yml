#D:\python projects\faceid-core\faceid-core\infrastructure\docker-compose.yml

version: '3.8'

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: faceid-core/infrastructure/docker/worker.Dockerfile
  command: celery -A app.workers.celery_app worker -Q celery,faceid --loglevel=info --concurrency=1
  environment:
    - ENV=testing
    - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
    - REDIS_URL=redis://redis:6379/0
    - REDIS_HOST=redis
    - FAISS_ENABLED=true
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_started
  volumes:
    - ./models:/app/models

services:
  postgres:
    image: ankane/pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faceid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: faceid-core/infrastructure/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=testing
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - FAISS_ENABLED=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./models:/app/models

  worker:
    <<: *worker-base
    deploy:
      replicas: 3

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
  minio_data:
