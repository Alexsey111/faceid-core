#D:\python projects\faceid-core\faceid-core\infrastructure\docker-compose.yml

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: faceid-core/infrastructure/docker/worker.Dockerfile
  deploy:
    resources:
      limits:
        cpus: "2.0"
  environment:
    - ENV=dev
    - MODELS_DIR=/app/models
    - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/faceid}
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - REDIS_HOST=${REDIS_HOST:-redis}
    - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    - CELERYD_PREFETCH_MULTIPLIER=1
    - WORKER_COUNT=8
    - WORKER_SEMAPHORE=${WORKER_SEMAPHORE:-1}
    - ASYNC_THROUGHPUT_PER_SEC=1000
    - BACKPRESSURE_MAX_QUEUE_DELAY_MS=750
    - EMBED_BATCH_ENABLED=true
    - EMBED_BATCH_SIZE=2
    - EMBED_BATCH_TIMEOUT_MS=10
    - EMBED_BATCH_MAX_WAIT_GUARD_MS=50
    - LIVENESS_ENABLED=false
    - FAISS_ENABLED=false
    - ONNX_INTRA_OP_THREADS=1
    - ONNX_INTER_OP_THREADS=1
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_started
  volumes:
    - prometheus_multiproc:/tmp/prometheus

services:
  postgres:
    image: ankane/pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faceid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: ankane/pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --bind 0.0.0.0
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: faceid-core/infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - ENV=dev
      - APP_ROLE=api
      - MODELS_DIR=/app/models
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERYD_PREFETCH_MULTIPLIER=1
      - WORKER_COUNT=8
      - WORKER_SEMAPHORE=${WORKER_SEMAPHORE:-1}
      - ASYNC_THROUGHPUT_PER_SEC=1000
      - BACKPRESSURE_MAX_QUEUE_DELAY_MS=750
      - EMBED_BATCH_ENABLED=true
      - EMBED_BATCH_SIZE=2
      - EMBED_BATCH_TIMEOUT_MS=10
      - EMBED_BATCH_MAX_WAIT_GUARD_MS=50
      - LIVENESS_ENABLED=false
      - FAISS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
      # Diagnostic series: soft gate
      - QUALITY_GATE_MODE=soft
      - QUALITY_MIN_FACE_SIDE=48
      - QUALITY_MIN_BLUR_SCORE=25
      - QUALITY_MIN_CONTRAST=10
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --http httptools --backlog 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - prometheus_multiproc:/tmp/prometheus
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  api_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./faceid-core/infrastructure/nginx/api_lb.conf:/etc/nginx/conf.d/default.conf:ro

  fast_worker:
    build:
      context: .
      dockerfile: faceid-core/infrastructure/docker/api.Dockerfile
    profiles:
      - disabled
    cpus: "2.0"
    deploy:
      resources:
        limits:
          cpus: "2.0"
    environment:
      - ENV=dev
      - APP_ROLE=fast_worker
      - MODELS_DIR=/app/models
      - WORKER_SEMAPHORE=${WORKER_SEMAPHORE:-1}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/faceid
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERYD_PREFETCH_MULTIPLIER=1
      - WORKER_COUNT=8
      - ASYNC_THROUGHPUT_PER_SEC=1000
      - BACKPRESSURE_MAX_QUEUE_DELAY_MS=750
      - EMBED_BATCH_ENABLED=true
      - EMBED_BATCH_SIZE=2
      - EMBED_BATCH_TIMEOUT_MS=10
      - EMBED_BATCH_MAX_WAIT_GUARD_MS=50
      - LIVENESS_ENABLED=false
      - FAISS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - USE_FAST_PATH=true
      - FAST_PATH_MAX_CONCURRENCY=4
      - FAST_WORKER_URL=http://fast_worker:8000
      - EMBED_BATCH_ENABLED=false
      - FAST_WORKER_MAX_CONCURRENCY=1
      - LIVENESS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop uvloop --http httptools --backlog 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - prometheus_multiproc:/tmp/prometheus

  worker:
    build:
      context: .
      dockerfile: faceid-core/infrastructure/docker/worker.Dockerfile
    cpus: "2.0"
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "2.0"
    environment:
      - ENV=dev
      - MODELS_DIR=/app/models
      - WORKER_SEMAPHORE=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/faceid}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - LIVENESS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      # Diagnostic series: soft gate
      - QUALITY_GATE_MODE=soft
      - QUALITY_MIN_FACE_SIDE=48
      - QUALITY_MIN_BLUR_SCORE=25
      - QUALITY_MIN_CONTRAST=10
      - BATCH_SIZE=2
      - BATCH_COLLECT_TIMEOUT=0.008
    command: python -m app.workers.verify_worker
    depends_on:
      - redis
      - postgres
    volumes:
      - prometheus_multiproc:/tmp/prometheus

  worker_metrics:
    build:
      context: .
      dockerfile: faceid-core/infrastructure/docker/worker.Dockerfile
    profiles:
      - disabled
    cpus: "2.0"
    deploy:
      resources:
        limits:
          cpus: "2.0"
    environment:
      - ENV=dev
      - MODELS_DIR=/app/models
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/faceid}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - LIVENESS_ENABLED=false
      - ONNX_INTRA_OP_THREADS=1
      - ONNX_INTER_OP_THREADS=1
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    command: python -m app.workers.verify_worker
    ports:
      - "9103:9101"
    depends_on:
      - redis
      - postgres
    volumes:
      - prometheus_multiproc:/tmp/prometheus

  worker_fast:
    <<: *worker-base
    profiles:
      - disabled
    cpus: "2.0"
    ports:
      - "9101:9100"
    command: celery -A app.workers.celery_app worker -Q verify_fast --loglevel=info --concurrency=2 --pool=prefork

  worker_heavy:
    <<: *worker-base
    profiles:
      - disabled
    cpus: "2.0"
    ports:
      - "9102:9100"
    command: celery -A app.workers.celery_app worker -Q verify_heavy --loglevel=info --concurrency=4 --pool=prefork

  prometheus:
    image: prom/prometheus
    ports:
      - "9190:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  autoscaler:
    build:
      context: .
      dockerfile: faceid-core/infrastructure/docker/autoscaler.Dockerfile
    profiles:
      - disabled
    command: python autoscaler/autoscaler.py
    network_mode: "host"
    depends_on:
      - prometheus
    environment:
      - PROMETHEUS_URL=http://localhost:9190
      - DOCKER_HOST=unix:///var/run/docker.sock
    working_dir: /workspace/faceid-core
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  minio_data:
  postgres_test_data:
  prometheus_multiproc:
