# docker-compose.demo.yml — override для локальной демонстрации FaceID Core.
#
# Назначение: поднять стек в режиме «презентация на локальном ПК»:
#   • AUTH_ENABLED=false      — демо-GUI работает без JWT/X-API-Key
#   • LIVENESS_ENABLED=true   — passive /liveness активен
#   • LIVENESS_ACTIVE_ENABLED=true — active WS-challenge активен (защита от cutout)
#
# Базовый docker-compose.yml захардкодил LIVENESS_ENABLED=false и не выставляет
# AUTH_ENABLED (default True) — override ставит демо-значения БЕЗ правки base.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
# Затем открыть http://localhost:8000/demo/ (getUserMedia на localhost без HTTPS).
#
# ВНИМАНИЕ: только dev/презентация. Не использовать в production без auth+HTTPS.
# См. docs/demo-guide.md.
services:
  api:
    environment:
      - AUTH_ENABLED=false
      - LIVENESS_ENABLED=true
      - LIVENESS_ACTIVE_ENABLED=true
      # demo не поднимает отдельный fast_worker (profile «disabled» в base compose),
      # а sync fast-path рассчитан на GPU + рабочий Celery-fallback. На CPU-demo без
      # Celery-worker'ов fast-path: (1) нет fast_worker → circuit-breaker, (2) fallback
      # на legacy async. Поэтому отключаем fast-path и идём напрямую в async-очередь
      # (face_verify_queue) → потребляется кастомным worker (app.workers.verify_worker),
      # который полностью обрабатывает no-face/quality/spoof. Soft-gate env api (base
      # compose: QUALITY_GATE_MODE=soft, blur≥25) → кадр веб-камеры доходит до match.
      - USE_FAST_PATH=false
  worker:
    environment:
      - LIVENESS_ENABLED=true
      - LIVENESS_ACTIVE_ENABLED=true