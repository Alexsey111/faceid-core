# pyproject.toml - Конфигурация проекта

[project]
name = "faceid-core"
version = "0.1.0"
description = "FaceID система биометрической идентификации"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pgvector==0.2.5",
    "redis==5.0.4",
    "celery==5.4.0",
    "prometheus-client==0.18.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "numpy>=1.26.4,<2",
    "opencv-python==4.9.0.80",
    "Pillow>=10.2.0",
    "pillow-heif>=0.15.0",
    "insightface==0.7.3",
    "onnxruntime==1.17.3",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "minio==7.2.5",
    "python-dotenv==1.0.1",
    "loguru==0.7.2",
    "alembic==1.13.1",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# importlib: не препендит test-директории в sys.path → нет затенения исходного
# пакета `evaluation` тестовым tests/evaluation и нет конфликта одинаковых имён
# тест-модулей (test_metrics.py в tests/ и tests/evaluation/).
addopts = "--import-mode=importlib -m \"not live\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "timeout: timeout for long-running tests",
    "integration: реальный Redis/DB/инфра (не чистый unit)",
    "live: smoke-тест против поднятого api-контейнера (localhost:8000); не входит в дефолтный прогон (исключён через addopts -m 'not live')"
]

# -------------------------
# Coverage
# -------------------------
# Измерение:  pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=html
# Gate (CI):  pytest --cov=app --cov-branch --cov-fail-under=90   (KPI CLAUDE.md ≥90%)
# fail_under НЕ зашит в конфиг — чтобы `pytest --cov` на частичных прогонах
# (только -m unit) не падал. Gate задаётся явным --cov-fail-under в CI на полном
# suite (unit+integration). Текущее покрытие: ~39% unit-only, выше с integration.
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__pycache__/*",
    "app/db/migrations/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["app", "evaluation", "autoscaler", "scripts"]
exclude = ["**/__pycache__", "**/.*", "**/node_modules", "**/venv", "**/.venv", "**/temp_venv", "**/dist", "**/build", "**/*.egg-info"]
pythonPath = "venv/Scripts/python.exe"
typeCheckingMode = "basic"
extraPaths = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
