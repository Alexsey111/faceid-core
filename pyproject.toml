# pyproject.toml - Конфигурация проекта

[project]
name = "faceid-core"
version = "0.1.0"
description = "FaceID система биометрической идентификации"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pgvector==0.2.5",
    "redis==5.0.4",
    "celery==5.4.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "numpy>=1.26.4,<2",
    "opencv-python==4.9.0.80",
    "insightface==0.7.3",
    "onnxruntime==1.17.3",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "minio==7.2.5",
    "python-dotenv==1.0.1",
    "loguru==0.7.2",
    "alembic==1.13.1",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["faceid-core"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "timeout: timeout for long-running tests"
]

[tool.pyright]
include = ["faceid-core"]
exclude = ["**/__pycache__", "**/.*", "**/node_modules", "**/venv", "**/.venv", "**/temp_venv", "**/dist", "**/build", "**/*.egg-info"]
pythonPath = "venv/Scripts/python.exe"
typeCheckingMode = "basic"
extraPaths = ["faceid-core"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
